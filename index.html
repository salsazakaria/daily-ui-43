<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salsa — Agent UI Kit</title>
<meta name="description" content="A live, animated crypto &amp; AI bento UI kit by Salsa.">
<meta property="og:title" content="Salsa — Agent UI Kit">
<meta property="og:description" content="A live, animated crypto &amp; AI bento UI kit by Salsa.">
<meta property="og:image" content="assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Geist-Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:G;src:url(assets/fonts/Geist-Regular.woff2);font-weight:400}
@font-face{font-family:G;src:url(assets/fonts/Geist-Medium.woff2);font-weight:500}
@font-face{font-family:G;src:url(assets/fonts/Geist-SemiBold.woff2);font-weight:600}
@font-face{font-family:GM;src:url(assets/fonts/GeistMono-Regular.woff2);font-weight:400}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#EEF4F7;font-family:G;color:#161616;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;display:block;background:#EEF4F7 url(assets/img/bg-poster.jpg) center/cover}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:50% 50%}
#kit{position:absolute;left:96px;top:0;height:917.1px;display:flex;gap:10.2px;align-items:center;transform:scale(1.1776);transform-origin:0 0}
.col{display:flex;flex-direction:column;gap:10.2px}
.tile{position:relative;border-radius:24px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(32px) saturate(1.25);backdrop-filter:blur(32px) saturate(1.25);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),0 14px 40px rgba(40,70,110,.07);overflow:hidden}
.in{background:rgba(248,248,248,.62);border-radius:18px}
.row{display:flex;align-items:center}
.grow{flex:1}
.mono{font-family:GM;letter-spacing:0}
.sub{color:#A3A3A3}.mid{color:#7E7E7E}
.ib{display:flex;align-items:center;justify-content:center;flex:none}
.coll{overflow:hidden}
.stack{display:inline-grid}.stack>*{grid-area:1/1;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;border-radius:13px;height:36px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden}
.dark{background:#242424;color:#fff}
.light{background:rgba(255,255,255,.75);color:#161616;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:10px;background:rgba(247,247,247,.85);font-size:12px;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px #EDEDED;font-size:10px;font-weight:500}
.hr{height:1px;background:rgba(0,0,0,.06)}
.cb{width:16px;height:16px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center}
</style></head><body>
<video id="bg" autoplay muted loop playsinline preload="auto" poster="assets/img/bg-poster.jpg" aria-hidden="true"><source src="assets/video/bg.webm" type="video/webm"><source src="assets/video/bg.mp4" type="video/mp4"></video>
<div id="stage"><div id="kit"></div></div>
<script>
// ---------------- icons ----------------
const IC={
 petal:'<rect x="9" y="2.5" width="6" height="19" rx="3" transform="rotate(45 12 12)"/><rect x="9" y="2.5" width="6" height="19" rx="3" transform="rotate(-45 12 12)"/>',
 sparkles:'<path d="M10 5c.5 4 3 6.5 7 7-4 .5-6.5 3-7 7-.5-4-3-6.5-7-7 4-.5 6.5-3 7-7zM18.5 3v4M16.5 5h4"/>',
 spark:'<path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/>',
 eyeOff:'<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 20L20 4"/>',
 eye:'<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
 clock:'<circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5M5 4L3 6M19 4l2 2"/>',
 refresh:'<path d="M19 12a7 7 0 11-2.2-5.1M19 4v4h-4"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 up:'<path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/>', down:'<path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/>',
 chev:'<path d="M6 9l6 6 6-6"/>',
 kebab:'<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>',
 pause:'<rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/>',
 play:'<path d="M7 5v14l12-7z"/>',
 shield:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>',
 unlink:'<path d="M8 11l-2 2a3.5 3.5 0 005 5l2-2M16 13l2-2a3.5 3.5 0 00-5-5l-2 2M4 4l16 16"/>',
 chart:'<path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/>',
 scale:'<path d="M12 4v16M5 8h14M5 8l-2 6h4l-2-6zM19 8l-2 6h4l-2-6zM8 20h8"/>',
 bolt:'<path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5"/>',
 laptop:'<rect x="5" y="6" width="14" height="9" rx="2"/><path d="M3 18h18"/>',
 wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>',
 radar:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 12l6-6"/>',
 ring:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>',
};
const FILLED=new Set(['petal','spark','kebab','pause','play']);
const ic=(n,s,c='#161616',sw=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="flex:none;display:block">`+(FILLED.has(n)?`<g fill="${c}">`:`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">`)+IC[n]+'</g></svg>';
const spin=(s,c)=>`<svg class="spin" width="${s}" height="${s}" viewBox="0 0 24 24" style="flex:none;display:block"><circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-opacity=".25" stroke-width="2.4"/><path d="M12 4a8 8 0 018 8" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`;

// ---------------- markup ----------------
const H=(s)=>{const d=document.createElement('div');d.innerHTML=s.trim();return d.firstElementChild;};
const kit=document.getElementById('kit');
const COLS=[300,285,262,290,290].map(w=>{const c=H(`<div class="col" style="width:${w}px"></div>`);kit.appendChild(c);return c;});
const tile=(col,html,style='')=>{const t=H(`<div class="tile" style="${style}">${html}</div>`);COLS[col].appendChild(t);return t;};

// 1 PROMPT
tile(0,`
<div style="padding:10px;display:flex;flex-direction:column;gap:8px">
 <div class="row" style="gap:8px;padding:4px 4px 0">
  <div class="ib" style="width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px #EDEDED">${ic('sparkles',13)}</div>
  <div style="font-size:13px;font-weight:600">Ask AI</div><div class="grow"></div>
  <div class="stack sub" style="font-size:10.5px;justify-items:end"><span id="pS0">Reasoning on-chain</span><span id="pS1">Thinking<span id="pDots">...</span></span><span id="pS2" style="color:#2E9E5B">Answered in 1.2s</span></div>
 </div>
 <div class="in" style="padding:12px;display:flex;flex-direction:column;gap:18px">
  <div style="min-height:36px;font-size:13px;font-weight:500;line-height:18px"><span id="pTxt"></span><span id="pCaret" style="display:inline-block;width:1.5px;height:15px;background:#161616;vertical-align:-2px;margin-left:1px"></span><span id="pPh" class="sub">Ask anything…</span></div>
  <div class="row" style="gap:6px">
   <div class="row" style="gap:4px;height:26px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.85);font-size:11px;font-weight:500">${ic('petal',9,'#4FC3F7')}Agent Pro${ic('chev',10,'#A3A3A3')}</div>
   <div class="row" style="height:26px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.85);font-size:11px;font-weight:500">Base</div>
   <div class="grow"></div>
   <div id="pSend" class="ib" style="width:28px;height:28px;border-radius:10px;background:#242424">${ic('up',13,'#fff',2)}</div>
  </div>
 </div>
 <div id="pReply" class="coll" style="margin-top:-8px"><div style="padding-top:8px"><div class="in" style="padding:10px 12px;display:flex;flex-direction:column;gap:6px">
  <div class="row" style="gap:8px"><div class="ib" style="width:22px;height:22px;border-radius:7px;background:#242424">${ic('petal',10,'#fff')}</div>
   <div style="font-size:12px;font-weight:500">Aave on Base</div><div class="grow"></div>
   <div style="font-size:12px;font-weight:600;color:#2E9E5B">6.82% APY</div></div>
  <div class="row" style="gap:6px;padding-left:30px"><div class="sub" style="font-size:10.5px">≈ $341 / year · low risk</div><div class="grow"></div>
   <div class="row" style="height:22px;padding:0 8px;border-radius:7px;background:#242424;color:#fff;font-size:10.5px;font-weight:500">Deposit</div></div>
 </div></div></div>
</div>`);

// 2 SCHEDULED
tile(0,`
<div style="padding:10px;display:flex;flex-direction:column">
 <div class="in" style="padding:14px 16px;display:flex;flex-direction:column;gap:3px">
  <div style="font-size:18px;font-weight:600;letter-spacing:-.025em">Weekly DCA</div><div class="mid" style="font-size:12px">Thu, Jul 9 · 17:00</div></div>
 <div class="row" style="height:44px;padding:0 8px;gap:8px">
  <div class="ib" style="width:20px;height:20px;border-radius:6px;background:#242424">${ic('petal',10,'#fff')}</div>
  <div class="mid" style="font-size:13px;font-weight:500">ETH → USDC</div><div class="grow"></div>
  <div id="sPill" class="row" style="height:28px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:500;gap:5px">
   <div class="stack" style="width:12px;height:12px"><span id="sI0">${ic('petal',11,'#FFA63D')}</span><span id="sI1">${spin(12,'#161616')}</span><span id="sI2">${ic('check',12,'#2E9E5B',2.4)}</span></div>
   <div class="stack"><span id="sT0" style="color:#F29A2E">Scheduled</span><span id="sT1">Executing</span><span id="sT2" style="color:#2E9E5B">Filled</span></div>
  </div></div>
 <div class="hr"></div>
 <div class="row" style="height:44px;padding:0 8px;gap:8px">${ic('clock',16,'#9A9A9A')}<div class="mid" style="font-size:13px;font-weight:500">17:00</div><div class="grow"></div><div class="chip">Lowest gas window</div></div>
 <div class="hr"></div>
 <div class="row" style="height:44px;padding:0 8px;gap:8px">${ic('sparkles',16,'#9A9A9A')}<div class="mid" style="font-size:13px;font-weight:500">Planned by</div><div class="grow"></div><div class="chip">AI</div></div>
 <div id="sFill" class="coll"><div style="padding:2px 0 8px"><div class="row" style="gap:10px;padding:10px 12px;border-radius:14px;background:rgba(233,247,238,.85)">
  <div class="ib" style="width:24px;height:24px;border-radius:99px;background:#2E9E5B">${ic('check',12,'#fff',2.6)}</div>
  <div style="display:flex;flex-direction:column;gap:1px"><div style="font-size:12px;font-weight:500">Bought 1,250 USDC @ $3,476</div><div class="sub" style="font-size:10.5px">Next run Thu, Jul 16 · gas $0.38</div></div>
 </div></div></div>
 <div style="height:12px"></div>
 <div class="row" style="gap:6px"><div class="btn light" style="flex:1">Reschedule</div><div id="sEdit" class="btn dark" style="flex:1">Edit order</div></div>
</div>`);

// 3 SIGNER
const step=(ind,body,last)=>`<div class="row" style="align-items:stretch;gap:10px"><div style="width:16px;display:flex;flex-direction:column;align-items:center;gap:4px">${ind}${last?'':'<div style="flex:1;border-left:1px dashed #CFCFCF"></div>'}</div><div style="flex:1;display:flex;flex-direction:column;gap:6px;padding-bottom:${last?0:10}px">${body}</div></div>`;
const num=(n,id)=>`<div class="stack" style="width:16px;height:16px"><div id="${id}a" class="cb" style="background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px #E5E5E5;font-size:9px;font-weight:500;color:#7E7E7E">${n}</div><div id="${id}b" class="cb" style="background:#242424">${ic('check',10,'#fff',2.6)}</div></div>`;
const code=(s,id)=>`<div class="row" style="height:34px;padding:0 5px 0 12px;border-radius:11px;background:rgba(248,248,248,.62)"><div class="mono" style="font-size:10.5px">${s}</div><div class="grow"></div>
 <div id="${id}" class="row" style="height:24px;padding:0 8px;border-radius:8px;background:rgba(255,255,255,.9);font-size:10px;font-weight:500"><div class="stack"><span id="${id}0">Copy</span><span id="${id}1" style="color:#2E9E5B;display:flex;gap:3px;align-items:center">${ic('check',10,'#2E9E5B',2.6)}Copied</span></div></div></div>`;
tile(1,`
<div style="padding:14px;display:flex;flex-direction:column;gap:12px">
 <div class="row" style="gap:10px">
  <div class="ib" style="width:34px;height:34px;border-radius:10px;background:#1E1E1E">${ic('key',17,'#FFC46B')}</div>
  <div style="display:flex;flex-direction:column;gap:2px"><div class="row" style="gap:6px"><div style="font-size:14px;font-weight:600">Signer</div><div class="tag">${ic('laptop',10,'#A3A3A3')}Local</div></div><div class="sub" style="font-size:10.5px">keys never leave this device</div></div>
 </div>
 <div style="padding-left:9px">
  ${step(`<div class="stack" style="width:16px;height:16px"><div id="g1a" style="display:flex;align-items:center;justify-content:center">${ic('refresh',14)}</div><div id="g1b" class="cb" style="background:#242424">${ic('check',10,'#fff',2.6)}</div></div>`,
     `<div style="font-size:12px;font-weight:500">Install the local bridge</div>${code('npm i -g @agent/signer','gc1')}`)}
  ${step(num(2,'g2'),`<div style="font-size:12px;font-weight:500">Start the server</div>${code('agent mcp start signer','gc2')}`)}
  ${step(num(3,'g3'),`<div style="font-size:12px;font-weight:500">Grant scopes</div><div class="row" style="gap:4px">`+
     ['balances:read','swap:quote','tx:sign'].map((s,i)=>`<div id="sc${i}" class="row mono" style="height:24px;padding:0 8px;border-radius:99px;font-size:9px">${s}</div>`).join('')+`</div>`,true)}
 </div>
 <div id="gOn" class="coll" style="margin-top:-12px"><div style="padding-top:12px"><div class="row" style="gap:8px;height:34px;padding:0 12px;border-radius:11px;background:rgba(233,247,238,.85)">
  <div style="width:7px;height:7px;border-radius:9px;background:#2E9E5B;box-shadow:0 0 0 3px rgba(46,158,91,.18)"></div><div style="font-size:11.5px;font-weight:500">Signer online</div><div class="grow"></div><div class="mono sub" style="font-size:10px">0x7a…3F9c</div></div></div></div>
</div>`);

// 4 MENU
const mrow=(i,icon,text,id)=>`<div class="row mrow" data-i="${i}" style="height:34px;padding:0 10px;gap:8px;position:relative">${icon}<div style="font-size:12.5px;font-weight:500" ${id?`id="${id}"`:''}>${text}</div></div>`;
tile(1,`
<div style="padding:10px;display:flex;flex-direction:column;gap:2px">
 <div class="row" style="padding-bottom:6px;justify-content:space-between">
  <div class="row" style="gap:5px;height:28px;padding:0 9px;border-radius:10px;background:rgba(248,248,248,.7);font-size:11px;font-weight:500">
   <div class="stack"><span id="mI0">${ic('petal',10,'#4FC3F7')}</span><span id="mI1">${ic('petal',10,'#FFA63D')}</span></div>
   <div class="stack"><span id="mC0">Last trade 2m ago</span><span id="mC1">Agent paused</span></div></div>
  <div class="ib" style="width:28px;height:28px;border-radius:10px;background:rgba(238,238,238,.85)">${ic('kebab',12)}</div>
 </div>
 <div id="mHold" class="coll"><div style="padding-bottom:6px"><div class="row" style="gap:8px;height:32px;padding:0 10px;border-radius:10px;background:rgba(255,236,214,.8);font-size:11px;font-weight:500;color:#B86E14">${ic('clock',13,'#B86E14')}3 scheduled orders on hold</div></div></div>
 <div id="mList" style="position:relative;display:flex;flex-direction:column">
  <div id="mHi" style="position:absolute;left:0;right:0;top:0;height:34px;border-radius:11px;background:rgba(248,248,248,.85)"></div>
  ${mrow(0,`<div class="stack" style="width:14px;height:14px"><span id="mP0">${ic('pause',14)}</span><span id="mP1">${ic('play',14)}</span></div>`,`<span class="stack"><span id="mT0">Pause agent</span><span id="mT1">Resume agent</span></span>`)}
  ${mrow(1,ic('sparkles',14,'currentColor'),'View trades')}
  ${mrow(2,ic('shield',14,'currentColor'),'Edit limits')}
  <div style="padding:3px 0"><div class="hr"></div></div>
  ${mrow(3,ic('unlink',14,'currentColor'),'Revoke access')}
 </div>
</div>`);

// 5 SWAP
const field=(lab,id,sym,col,sub)=>`<div class="in" style="padding:9px 12px;display:flex;flex-direction:column;gap:2px;border-radius:16px">
 <div class="row sub" style="font-size:10.5px;justify-content:space-between"><span>${lab}</span><span id="${id}u">${sub}</span></div>
 <div class="row" style="justify-content:space-between"><div id="${id}" style="font-size:21px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums"></div>
 <div class="row" style="gap:5px;padding:4px 6px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:11px;font-weight:500"><div style="width:16px;height:16px;border-radius:9px;background:${col}"></div>${sym}${ic('chev',10,'#A3A3A3')}</div></div></div>`;
tile(2,`
<div style="padding:10px;display:flex;flex-direction:column;gap:6px;position:relative">
 ${field('You pay','wA','ETH','#8090FF','')}
 <div id="wArr" class="ib" style="position:absolute;left:119px;top:69px;width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px #EDEDED;z-index:2">${ic('down',11,'#161616',2.2)}</div>
 ${field('You receive','wB','USDC','#4D97FF','Best route')}
 <div id="wRoute" class="coll" style="margin-top:-6px"><div class="row" style="gap:6px;padding:12px 4px 2px;font-size:10.5px"><span class="sub">Route</span><span style="font-weight:500">Uniswap → Aerodrome</span><div class="grow"></div><span class="sub">${ic('bolt',9,'#A3A3A3')}</span><span class="sub">$0.42</span></div></div>
 <div style="height:4px"></div>
 <div id="wBtn" class="btn dark" style="width:100%">
  <div class="stack"><span id="wB0">Review swap</span><span id="wB1" style="display:flex;gap:7px;align-items:center">${spin(14,'#fff')}Swapping</span><span id="wB2" style="display:flex;gap:6px;align-items:center">${ic('check',14,'#fff',2.4)}Swapped</span></div></div>
</div>`);

// 6 AGENTS
const arow=(i,icon,a,b,det)=>`<div class="arow" style="border-radius:14px;padding:9px 12px;display:flex;gap:10px">
 <div style="padding-top:1px">${ic(icon,15)}</div>
 <div style="flex:1;display:flex;flex-direction:column;gap:2px"><div style="font-size:13px;font-weight:500">${a}</div><div class="sub" style="font-size:11px">${b}</div>
 <div class="coll adet"><div class="row" style="gap:6px;padding-top:7px">${det}</div></div></div></div>`;
const pill=(s,c,bg)=>`<span class="row" style="height:20px;padding:0 7px;border-radius:7px;background:${bg};color:${c};font-size:10.5px;font-weight:500;gap:4px">${s}</span>`;
const live=`<span style="width:6px;height:6px;border-radius:6px;background:#2E9E5B"></span>`;
tile(2,`

// ---------------- animation helpers ----------------
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eOut=p=>1-Math.pow(1-p,3);
const eBack=p=>{const c=1.6,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

function states(prefix,ws,dy=5){ws.forEach((w,i)=>{const e=$(prefix+i);if(!e)return;e.style.opacity=clamp(w*2-1);e.style.transform=`translateY(${(1-w)*dy*(i%2?1:-1)}px) scale(${.92+.08*w})`;});}

// ---------------- live loop ----------------
const stage=document.getElementById('stage');
function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${sc})`;}
addEventListener('resize',fit);fit();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0=null;
function loop(now){if(t0===null)t0=now;render(still?5.3:((now-t0)/1000)%16);if(!still)requestAnimationFrame(loop);}
document.fonts.ready.then(()=>requestAnimationFrame(loop));
// keep the videos going if the browser paused them (e.g. tab switch)
document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}));});
